<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر أبو يونس للألعاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

    <!-- شريط الرأس الرئيسي -->
    <header class="bg-gray-900 border-b-2 border-blue-600 sticky top-0 z-40 shadow-2xl">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-lg shadow-blue-600/40">
                    <i class="fa-solid fa-gamepad text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-black text-white tracking-wider">
                        متجر <span class="text-blue-500">أبو يونس</span> للألعاب
                    </h1>
                    <p class="text-xs text-blue-300 font-semibold mt-0.5">قسم ألعاب بلايستيشن 4 (PS4)</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="toggleCart()" class="relative bg-blue-600/20 hover:bg-blue-600/30 text-white px-4 py-2.5 rounded-xl font-bold transition flex items-center space-x-2 space-x-reverse border border-blue-500/40 cursor-pointer">
                    <i class="fa-solid fa-cart-shopping text-blue-400 text-lg"></i>
                    <span class="text-sm">السلة</span>
                    <span id="cart-count" class="bg-blue-600 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-extrabold shadow-md">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- شريط البحث والترحيب -->
    <section class="bg-gradient-to-r from-blue-900/40 via-gray-900 to-blue-900/40 border-b border-gray-800 py-6">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <p class="text-base md:text-lg font-bold text-gray-200 mb-4">
                🎮 أهلاً بكم في <span class="text-blue-400 font-black">متجر أبو يونس</span> - تصفح واطلب ألعابك مباشرة عبر الواتساب 🎮
            </p>
            <div class="relative max-w-xl mx-auto">
                <input type="text" id="search-input" oninput="filterGames()" placeholder="ابحث برقم اللعبة (مثال: 10)..." class="w-full bg-gray-900 text-white border border-gray-700 rounded-xl py-3 px-11 text-sm focus:outline-none focus:border-blue-500 transition shadow-inner">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-gray-400"></i>
            </div>
        </div>
    </section>

    <!-- عرض الألعاب -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
        <div id="no-results" class="hidden text-center py-16 text-gray-400">
            <i class="fa-solid fa-circle-exclamation text-4xl mb-2 text-gray-600"></i>
            <p class="text-lg">لم يتم العثور على ألعاب مطابقة للبحث</p>
        </div>
    </main>

    <!-- نافذة السلة الجانبية -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex justify-end backdrop-blur-sm">
        <div class="bg-gray-900 w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto border-r border-gray-800">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-4">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-blue-500"></i>
                    سلة طلبات متجر أبو يونس
                </h3>
                <button onclick="toggleCart()" class="text-3xl text-gray-400 hover:text-white cursor-pointer">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow space-y-3"></div>
            <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl mt-4 transition cursor-pointer shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2 space-x-reverse text-base">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                <span>إرسال الطلب لـ أبو يونس عبر الواتساب</span>
            </button>
        </div>
    </div>

    <footer class="bg-gray-900 border-t border-gray-800 text-center py-4 text-sm text-gray-400">
        جميع الحقوق محفوظة &copy; <strong class="text-white">متجر أبو يونس للألعاب</strong>
    </footer>

    <script>
        // توليد الـ 183 لعبة تلقائياً مع صورها
        const totalImagesCount = 183; 
        const games = [];

        for (let i = 1; i <= totalImagesCount; i++) {
            games.push({
                id: i,
                name: `لعبة بلايستيشن 4 - #${i}`,
                image: `images/g (${i}).jpg`
            });
        }

        let cart = [];

        function renderGames(gamesList) {
            const grid = document.getElementById('games-grid');
            const noResults = document.getElementById('no-results');
            grid.innerHTML = '';
            
            if (gamesList.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            gamesList.forEach(game => {
                grid.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg flex flex-col transition hover:border-blue-500/50 hover:shadow-blue-500/10">
                        <div class="aspect-[3/4] overflow-hidden bg-gray-950 relative">
                            <img src="${game.image}" alt="${game.name}" class="w-full h-full object-cover transition duration-300 hover:scale-105" onerror="this.src='https://via.placeholder.com/300x400?text=PS4+Game'">
                        </div>
                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <h3 class="font-bold text-white text-sm md:text-base mb-3 line-clamp-2">${game.name}</h3>
                            <button onclick="addToCart(${game.id})" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-3 rounded-xl font-bold text-xs md:text-sm transition flex items-center justify-center space-x-2 space-x-reverse cursor-pointer shadow-md shadow-blue-600/30">
                                <i class="fa-solid fa-cart-plus"></i>
                                <span>إضافة للسلة</span>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterGames() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = games.filter(g => g.name.toLowerCase().includes(query) || g.id.toString().includes(query));
            renderGames(filtered);
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function addToCart(id) {
            const game = games.find(g => g.id === id);
            const existing = cart.find(item => item.id === id);
            if (!existing) {
                cart.push({...game, qty: 1});
            }
            updateCartUI();
            toggleCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">السلة فارغة حالياً</p>';
                return;
            }
            cart.forEach(item => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-950 p-3 rounded-xl border border-gray-800">
                        <div class="flex items-center space-x-3 space-x-reverse">
                            <img src="${item.image}" class="w-12 h-12 object-cover rounded-lg">
                            <span class="font-bold text-sm text-white">${item.name}</span>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-400 hover:text-red-300 p-2 cursor-pointer">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            let text = "مرحباً أبو يونس، أود طلب الألعاب التالية:%0A";
            cart.forEach((item, index) => {
                text += `${index + 1}- ${item.name}%0A`;
            });
            let phone = "9647726541533"; // رقم الواتساب الخاص بك
            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        }

        renderGames(games);
    </script>
</body>
</html>
